name: readme

on:
  # Every 5 hours, which also moves the city between day and night.
  schedule:
    - cron: "23 */5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "mise.toml", "package.json", "aube-lock.yaml", ".github/workflows/readme.yml"]

permissions:
  contents: write

concurrency:
  group: readme

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Regenerate README
        run: mise run readme
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # optional PAT (read:user); adds private contributions to the stats and city
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit changes
        run: |
          git add README.md assets data
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile"
          # If main moved during the run, replay this commit on top, keeping
          # the freshly generated files on conflict.
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
