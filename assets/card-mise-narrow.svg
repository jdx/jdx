<svg xmlns="http://www.w3.org/2000/svg" width="430" height="132" viewBox="0 0 430 132" role="img" aria-label="mise: dev tools, env vars, and tasks. Install: curl https://mise.run | sh">
<!-- SVG-in-img approach after @georgekobaidze: https://github.com/georgekobaidze/georgekobaidze -->
<style>
@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:JBM,ui-monospace,SFMono-Regular,Menlo,monospace}

.cover{transform:translateX(202.8px);animation:type 1.17s steps(26,jump-end) 0.40s backwards}
.caret{opacity:0;animation:caret 1.97s steps(1) 0.40s backwards}
@keyframes type{from{transform:translateX(0)}}
@keyframes caret{0%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.cover,.caret{animation:none}}
</style>
<rect x="0.5" y=".5" width="429" height="123" rx="10" fill="#141413" stroke="#2a2a25"/>
