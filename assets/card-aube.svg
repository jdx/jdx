<svg xmlns="http://www.w3.org/2000/svg" width="430" height="132" viewBox="0 0 430 132" role="img" aria-label="aube: a fast Node.js package manager. Install: mise use -g aube">
<!-- SVG-in-img approach after @georgekobaidze: https://github.com/georgekobaidze/georgekobaidze -->
<style>
@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:JBM,ui-monospace,SFMono-Regular,Menlo,monospace}

.cover{transform:translateX(124.8px);animation:type 0.72s steps(16,jump-end) 1.10s backwards}
.caret{opacity:0;animation:caret 1.52s steps(1) 1.10s backwards}
@keyframes type{from{transform:translateX(0)}}
@keyframes caret{0%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.cover,.caret{animation:none}}
</style>
<rect x="4.5" y=".5" width="425" height="123" rx="10" fill="#141413" stroke="#2a2a25"/>
<image href="data:image/svg+xml;base64," x="24" y="18" width="28" height="28"/>
<text x="62" y="39" font-size="20" font-weight="700" fill="#e8e6e0">aube</text>
<text x="122" y="38" font-size="10" fill="#e8b84b" letter-spacing="1.2">RUST CLI</text>
<path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.5 5.8 21l1.6-7L2 9.3l7.1-.7z" transform="translate(378.4 27) scale(0.5)" fill="#9a9890"/>
<text x="410" y="38" font-size="13" fill="#9a9890" text-anchor="end">2k</text>
<text x="24" y="70" font-size="14" fill="#9a9890">a fast Node.js package manager</text>
<defs><clipPath id="strip"><rect x="24" y="84" width="386" height="26" rx="6"/></clipPath></defs>
<rect x="24" y="84" width="386" height="26" rx="6" fill="#1a1a18"/>
<text x="36" y="102" font-size="13" fill="#e8e6e0"><tspan fill="#e8b84b">$</tspan> mise use -g aube</text>
<g clip-path="url(#strip)"><g class="cover">
<rect x="51.6" y="84" width="140.4" height="26" fill="#1a1a18"/>
<rect class="caret" x="51.6" y="90.6" width="7.8" height="14.9" fill="#e8b84b"/>
</g></g>
</svg>
