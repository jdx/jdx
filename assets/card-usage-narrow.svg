<svg xmlns="http://www.w3.org/2000/svg" width="184" height="130" viewBox="0 0 184 130" role="img" aria-label="usage: a specification for CLIs. Install: mise use -g usage">
<!-- SVG-in-img approach after @georgekobaidze: https://github.com/georgekobaidze/georgekobaidze -->
<style>
@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:JBM,ui-monospace,SFMono-Regular,Menlo,monospace}

.cover{transform:translateX(102px);animation:type 0.77s steps(17,jump-end) 1.80s backwards}
.caret{opacity:0;animation:caret 1.56s steps(1) 1.80s backwards}
@keyframes type{from{transform:translateX(0)}}
@keyframes caret{0%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.cover,.caret{animation:none}}
</style>
<rect x="4.5" y=".5" width="179" height="121" rx="9" fill="#141413" stroke="#2a2a25"/>
<image href="data:image/png;base64," x="16" y="12" width="20" height="20"/>
<text x="43" y="28" font-size="16" font-weight="700" fill="#e8e6e0">usage</text>
<path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.5 5.8 21l1.6-7L2 9.3l7.1-.7z" transform="translate(16 39.5) scale(0.41700000000000004)" fill="#9a9890"/>
<text x="29" y="48" font-size="11" fill="#9a9890">1k</text>
<text x="172" y="48" font-size="9" fill="#e8b84b" letter-spacing="1" text-anchor="end">RUST SPEC</text>
<text x="16" y="68" font-size="11" fill="#9a9890">a specification for</text>
<text x="16" y="82" font-size="11" fill="#9a9890">CLIs</text>
<defs><clipPath id="strip"><rect x="16" y="92" width="156" height="22" rx="6"/></clipPath></defs>
<rect x="16" y="92" width="156" height="22" rx="6" fill="#1a1a18"/>
<text x="23" y="107" font-size="10" fill="#e8e6e0"><tspan fill="#e8b84b">$</tspan> mise use -g usage</text>
<g clip-path="url(#strip)"><g class="cover">
<rect x="35" y="92" width="114" height="22" fill="#1a1a18"/>
<rect class="caret" x="35" y="98.2" width="6" height="11.5" fill="#e8b84b"/>
</g></g>
</svg>
