<svg xmlns="http://www.w3.org/2000/svg" width="430" height="65" viewBox="0 0 430 65" role="img" aria-label="&#62; @jdx _">
<!-- SVG-in-img approach after @georgekobaidze: https://github.com/georgekobaidze/georgekobaidze -->
<style>
@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:JBM,ui-monospace,SFMono-Regular,Menlo,monospace}

.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
<rect x=".5" y=".5" width="429" height="64" rx="10" fill="#0c0c0b" stroke="#2a2a25"/>
<text x="23" y="41.9" font-size="26" font-weight="700" fill="#e8e6e0"><tspan fill="#e8b84b">&gt;</tspan> @jdx <tspan class="cur" fill="#e8b84b">_</tspan></text>
<text x="407" y="36.8" font-size="12" fill="#9a9890" text-anchor="end">open source at entire.io</text>
</svg>
