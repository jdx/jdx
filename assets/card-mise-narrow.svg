<path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.5 5.8 21l1.6-7L2 9.3l7.1-.7z" transform="translate(355 27) scale(0.5)" fill="#9a9890"/>
<text x="410" y="38" font-size="13" fill="#9a9890" text-anchor="end">34.5k</text>
<text x="20" y="70" font-size="14" fill="#9a9890">dev tools, env vars, and tasks</text>
<defs><clipPath id="strip"><rect x="20" y="84" width="390" height="26" rx="6"/></clipPath></defs>
